      taejongdae: ['태종대', 'Taejongdae'], yongdusan: ['용두산', '부산타워', 'Yongdusan', 'Busan Tower'], haedong: ['해동용궁사', 'Yonggungsa'],
      bulguksa: ['불국사', 'Bulguksa'], gjmuseum: ['국립경주박물관', 'Gyeongju National Museum'], daereungwon: ['대릉원', '천마총', 'Daereungwon', 'Cheonmachong'],
      wolji: ['동궁과월지', '안압지', 'Wolji', 'Anapji'], cheomseongdae: ['첨성대', 'Cheomseongdae'], seokguram: ['석굴암', 'Seokguram'],
      hwangnidan: ['황리단길', 'Hwangnidan'], gyochon: ['교촌', 'Gyochon'], woljeonggyo: ['월정교', 'Woljeonggyo'],
      seongsan: ['성산일출봉', 'Ilchulbong'], seopjikoji: ['섭지코지', 'Seopjikoji'], woljeongri: ['월정리해수욕장', '월정리해변', 'Woljeongri Beach'],
      hamdeok: ['함덕해수욕장', '함덕서우봉', 'Hamdeok Beach'], osulloc: ['오설록', 'Osulloc', "O'sulloc"], jusangjeolli: ['주상절리', 'Jusangjeolli'],
      cheonjiyeon: ['천지연', 'Cheonjiyeon'], hyeopjae: ['협재해수욕장', 'Hyeopjae Beach'], dongmun: ['동문시장', 'Dongmun']
    };
    const norm = s => String(s || '').toLowerCase().replace(/[\s_\-·.,'’()]/g, '');
    const spotLocs = Object.entries(SPOT_AT).map(([photo, [lat, lng]]) => ({ photo, lat, lng }));
    function nearSpotPhoto(place) {
      // 이름이 맞고, 2km 안에 있는 지니맵 명소의 사진
      const here = { lat: place.location.lat(), lng: place.location.lng() };
      const name = norm(place.displayName);
      const hit = spotLocs.find(s => kmBetween(s, here) < 2 && (SPOT_WORDS[s.photo] || []).some(w => name.includes(norm(w))));
      return hit ? hit.photo : '';
    }

    // 관광명소인데 지니맵 사진이 없으면: Wikimedia Commons에서 그 장소 이름으로 자유 이용 사진 찾기
    //  (사진 파일 이름에 장소 이름이 그대로 들어 있을 때만 써요 → 다른 곳 사진이 붙지 않게)
    const commonsCache = new Map();
    let commonsChain = Promise.resolve(); // 한 번에 하나씩 차례로 (Wikimedia 서버 배려)
    function commonsPhoto(name, lat, lng) {
      const key = norm(name);
      if (key.length < 3) return Promise.resolve(null);
      if (commonsCache.has(key)) return commonsCache.get(key);
      // 사진에 찍힌 위치(GPS)가 있으면 실제 장소에서 가까운지 확인
      const gpsKm = md => {
        const la = parseFloat(md.GPSLatitude?.value), lo = parseFloat(md.GPSLongitude?.value);
        return isNaN(la) || isNaN(lo) ? null : kmBetween({ lat, lng }, { lat: la, lng: lo });
      };
      const api = (host, params) => fetch(`https://${host}/w/api.php?` + new URLSearchParams({ ...params, format: 'json', origin: '*' }))
        .then(r => r.ok ? r.json() : null);
      const toPhoto = ii => {
        const md = ii.extmetadata || {};
        const artistDoc = new DOMParser().parseFromString(md.Artist?.value || '', 'text/html'); // 글자만 꺼내기
        const by = artistDoc.body.textContent.replace(/\s+/g, ' ').trim().slice(0, 40) || 'Wikimedia Commons';
        return { src: ii.thumburl, page: ii.descriptionurl, by, lic: md.LicenseShortName?.value || '' };
      };
      const job = commonsChain.then(async () => {
        try {
          // 1) Commons에서 파일 이름에 장소 이름이 들어간 사진
          const data = await api('commons.wikimedia.org', {
            action: 'query', generator: 'search', gsrsearch: name + ' filetype:bitmap', gsrnamespace: '6', gsrlimit: '5',
            prop: 'imageinfo', iiprop: 'url|extmetadata', iiurlwidth: '480'
          });
          const pages = Object.values(data?.query?.pages || {}).sort((a, b) => a.index - b.index);
          for (const pg of pages) {
            const ii = pg.imageinfo?.[0];
            const km = ii ? gpsKm(ii.extmetadata || {}) : null;
            // 파일 이름에 장소 이름이 있고, 3km 안에서 찍힌 사진만
            if (ii?.thumburl && norm(pg.title).includes(key) && km !== null && km < 3) return toPhoto(ii);
          }

          // 2) 위키백과에서 이름이 같은 문서의 대표 사진 (Commons에 있는 자유 이용 사진만)
          const wiki = /[가-힣]/.test(name) ? 'ko' : LANG === 'ja' || LANG === 'zh' ? LANG : 'en';
          const w = await api(`${wiki}.wikipedia.org`, { action: 'query', generator: 'search', gsrsearch: name, gsrlimit: '1', prop: 'pageimages', piprop: 'name' });
          const art = Object.values(w?.query?.pages || {})[0];
          const t = norm(art?.title);
          const same = t === key || (key.length >= 4 && (t.includes(key) || key.includes(t)) && Math.abs(t.length - key.length) <= 3);
          if (!art?.pageimage || !same) return null;
          const c = await api('commons.wikimedia.org', { action: 'query', titles: 'File:' + art.pageimage, prop: 'imageinfo', iiprop: 'url|extmetadata', iiurlwidth: '480' });
          const ii = Object.values(c?.query?.pages || {})[0]?.imageinfo?.[0];
          if (!ii?.thumburl) return null;
          // 위치 정보가 있으면 5km 안이어야 하고, 없으면 한국어 위키백과 문서일 때만 믿어요
          const km = gpsKm(ii.extmetadata || {});
          return (km !== null ? km < 5 : wiki === 'ko') ? toPhoto(ii) : null;
        } catch (e) {
          return null;
        } finally {
          await new Promise(r => setTimeout(r, 120));
        }
      });
      commonsChain = job;
      commonsCache.set(key, job);
      return job;
    }

    // Google 장소를 간단한 기록으로 바꿔 기억해 두기
    function remember(place, photo, isSight = false) {
      if (photo && !spotPhotoById.has(place.id)) {
        spotPhotoById.set(place.id, photo);
        spotLocs.push({ photo, lat: place.location.lat(), lng: place.location.lng() });
      }
      const own = photo || spotPhotoById.get(place.id) || (isSight ? nearSpotPhoto(place) : '');
      const g = own ? null : googlePhoto(place);
      const rec = {
        id: place.id,
        name: place.displayName,
        address: place.formattedAddress || '',
        lat: place.location.lat(),
        lng: place.location.lng(),
        url: place.googleMapsURI || '',
        photo: own,
        gphoto: g
      };
      placeIndex.set(rec.id, rec);
      return rec;
    }

    // 목록 왼쪽 사진 칸
    function thumbHtml(rec, label, color, iconKey) {
      if (rec.photo) {
        return `<div class="thumb" style="background-image:url('${esc(photoUrl(rec.photo))}')"><span class="num">${label}</span></div>${creditHtml(rec.photo, 'thumb-credit')}`;
      }
      if (rec.gphoto) {
        return `<div class="thumb" style="background-image:url('${esc(rec.gphoto.src)}')"><span class="num">${label}</span></div>
          <a class="thumb-credit" href="${esc(rec.gphoto.page)}" target="_blank" rel="noopener" title="${esc(T.googlePhoto)}">📷 ${esc(rec.gphoto.by)}</a>`;
      }
      if (rec.wphoto) {
        return `<div class="thumb" style="background-image:url('${esc(rec.wphoto.src)}')"><span class="num">${label}</span></div>
          <a class="thumb-credit" href="${esc(rec.wphoto.page)}" target="_blank" rel="noopener" title="${esc(rec.wphoto.by)} · ${esc(rec.wphoto.lic)}">📷 ${esc(rec.wphoto.by)}</a>`;
      }
      return `<div class="thumb cat-thumb" style="--c:${color}">${svg(ICON[iconKey], 34)}<span class="num">${label}</span></div>`;
    }
    const recPhotoSrc = rec => rec.photo ? photoUrl(rec.photo) : rec.gphoto ? rec.gphoto.src : rec.wphoto ? rec.wphoto.src : '';

    function saveBtnHtml(rec) {
      const on = isSaved(rec.id);
      return `<span class="save-btn${on ? ' on' : ''}" role="button" tabindex="0" data-id="${esc(rec.id)}" title="${esc(on ? T.unsave : T.save)}" aria-pressed="${on}">${on ? '♥' : '♡'}</span>`;
    }

    function toggleSave(id) {
      if (isSaved(id)) {
        saved = saved.filter(s => s.id !== id);
        toast(T.removedToast);
      } else {
        const rec = placeIndex.get(id);
        if (!rec) return;
        saved.push({ ...rec, gphoto: null }); // Google 사진 주소는 시간이 지나면 바뀌어서 저장하지 않음
        toast(T.savedToast);
      }
      persistSaved();
      const on = isSaved(id);
      document.querySelectorAll(`.save-btn[data-id="${CSS.escape(id)}"]`).forEach(b => {
        b.classList.toggle('on', on);
        b.textContent = on ? '♥' : '♡';
        b.title = on ? T.unsave : T.save;
        b.setAttribute('aria-pressed', on);
      });
      if (mode === 'mine') showMine();
    }

    // ---------- 내 위치에서 거리 ----------
    function distHtml(rec) {
      return `<div class="dist" data-lat="${rec.lat}" data-lng="${rec.lng}">${myPos ? esc(T.fromMe(kmBetween(myPos, rec).toFixed(1) + ' km')) : ''}</div>`;
    }
    function updateDistances() {
      if (!myPos) return;
      document.querySelectorAll('.dist').forEach(el => {
        const d = kmBetween(myPos, { lat: +el.dataset.lat, lng: +el.dataset.lng });
        el.textContent = T.fromMe(d.toFixed(1) + ' km');
      });
    }

    // ---------- 네이버 지도·티맵 앱으로 길찾기 ----------
    // API 키 없이, 각 앱이 정한 링크 주소(URL Scheme)로 휴대폰 앱을 열어요.
    const SITE_URL = 'https://jiniya1227.github.io/genie-map/'; // 네이버가 요구하는 'appname'(웹은 내 사이트 주소)
    const isMobile = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const tmapStore = () => isIOS() ? 'https://apps.apple.com/kr/app/id431589174'
      : 'https://play.google.com/store/apps/details?id=com.skt.tmap.ku';

    function appLinks(rec) {
      const lat = rec.lat.toFixed(6), lng = rec.lng.toFixed(6);
      const name = encodeURIComponent(rec.name);
      return {
        // 네이버 지도: 대중교통 길찾기 (출발지를 비우면 내 현재 위치에서 출발)
        naverApp: `nmap://route/public?dlat=${lat}&dlng=${lng}&dname=${name}&appname=${encodeURIComponent(SITE_URL)}`,
        naverWeb: `https://map.naver.com/p/search/${name}`,
        // 티맵: 자동차 길안내 (X = 경도, Y = 위도)
        tmapApp: `tmap://route?rGoName=${name}&rGoX=${lng}&rGoY=${lat}`
      };
    }

    function appButtonsHtml(rec, withGoogle = false) {
      const l = appLinks(rec);
      return `
        <div class="app-btns">
          ${withGoogle ? `<a class="app-btn google gmap-link" href="${esc(rec.url)}" target="_blank" rel="noopener"><i>G</i>${T.openGoogle}</a>` : ''}
          <a class="app-btn naver" href="${esc(isMobile() ? l.naverApp : l.naverWeb)}" data-app-url="${esc(l.naverApp)}" target="_blank" rel="noopener"
             title="${esc(T.naverTitle)}" data-app="naver" data-web="${esc(l.naverWeb)}"><i>N</i>${T.naver}</a>
          <a class="app-btn tmap" href="${esc(l.tmapApp)}" title="${esc(T.tmapTitle)}" data-app="tmap"><i>T</i>${T.tmap}</a>
        </div>`;
    }

    // ---------- 링크 모드 (키 없이도 쓰는 방식) ----------
    // Google 지도가 안 뜨거나(사용량 소진·키 문제) 장소 정보를 못 받으면,
    // 지니맵이 직접 가진 정보(명소 이름·사진·팁·위치)와 지도 앱 링크로 계속 보여 줘요.
    let placesDown = false;
    const naverSearchUrl = q => 'https://map.naver.com/p/search/' + encodeURIComponent(q);
    const googleSearchUrl = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
    const googleDirUrl = (from, to) => 'https://www.google.com/maps/dir/?' + new URLSearchParams({ api: '1', origin: from, destination: to, travelmode: 'transit' });

    // 지니맵 명소 → 장소 기록 (Google 없이)
    function spotRec(key) {
      const [lat, lng] = SPOT_AT[key];
      const rec = { id: 'spot:' + key, name: spotName(key), address: '', lat, lng, url: googleSearchUrl(spotInfo(key).query), photo: key, gphoto: null, kind: 'attraction' };
      placeIndex.set(rec.id, rec);
      return rec;
    }

    // "네이버 지도 / Google 지도에서 검색 결과 보기" 버튼
    function searchLinksHtml(naverQ, googleQ) {
      return `
        <div class="app-btns">
          <a class="app-btn naver gmap-link" href="${esc(naverSearchUrl(naverQ))}" target="_blank" rel="noopener"><i>N</i>${T.naver}</a>
          <a class="app-btn google gmap-link" href="${esc(googleSearchUrl(googleQ))}" target="_blank" rel="noopener"><i>G</i>${T.openGoogle}</a>
        </div>`;
    }

    // 지금 보고 있는 지역 (링크 검색어에 씀)
    const currentRegion = () => weatherRegion && weatherRegion !== 'all' ? weatherRegion : 'seoul';

    function showMapRest() {
      mapsReady = false;
      showMapMsg(T.linkTitle, T.linkText);
    }

    // 카드 안의 작은 버튼·링크를 누르면 카드 자체는 눌리지 않게 먼저 처리
    document.addEventListener('click', e => {
      const save = e.target.closest('.save-btn');
      if (save) { e.preventDefault(); e.stopPropagation(); toggleSave(save.dataset.id); return; }

      const link = e.target.closest('.credit, .thumb-credit, .gmap-link');
      if (link) { e.preventDefault(); e.stopPropagation(); window.open(link.href, '_blank', 'noopener'); return; }

      const btn = e.target.closest('.app-btn');
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      const isNaver = btn.dataset.app === 'naver';
      if (!isMobile()) {
        // 컴퓨터: 네이버는 웹 지도를 새 창으로, 티맵은 휴대폰에서 쓰라고 안내
        if (isNaver) window.open(btn.dataset.web, '_blank', 'noopener');
        else toast(T.tmapPhone);
        return;
      }
      // 휴대폰: 앱을 열고, 앱이 없으면 네이버는 웹 지도 · 티맵은 앱 설치 화면으로
      const fallback = isNaver ? btn.dataset.web : tmapStore();
      const started = Date.now();
      location.href = isNaver ? btn.dataset.appUrl : btn.getAttribute('href');
      setTimeout(() => {
        // 앱이 열리면 이 페이지가 뒤로 가려져요. 그대로 보이면 앱이 없는 것
        if (!document.hidden && Date.now() - started < 3000) location.href = fallback;
      }, 1500);
    }, true);
    document.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('save-btn')) {
        e.preventDefault();
        e.stopPropagation();
        toggleSave(e.target.dataset.id);
      }
    }, true);

    // ---------- 날씨 카드 (Google Weather API) ----------
    let weatherRegion = null;
    const weatherCache = new Map();
    function setWeatherRegion(key) {
      if (key === weatherRegion) return;
      weatherRegion = key;
      $('wcTitle').textContent = key === 'all' ? T.allKorea : `${REGIONS[key].name[LANG]}${LANG !== 'en' ? ' · ' + REGIONS[key].name.en : ''}`;
      loadWeather(key);
    }
    async function loadWeather(key) {
      const box = $('wcWeather');
      if (GOOGLE_MAPS_API_KEY.includes('YOUR_')) { box.innerHTML = ''; return; }
      const r = REGIONS[key];
      const placeName = key === 'all' ? REGIONS.seoul.name[LANG] : r.name[LANG];
      try {
        if (!weatherCache.has(key)) {
          weatherCache.set(key, fetch('https://weather.googleapis.com/v1/currentConditions:lookup?' + new URLSearchParams({
            key: GOOGLE_MAPS_API_KEY,
            'location.latitude': r.center.lat,
            'location.longitude': r.center.lng,
            languageCode: LANG_CODE
          })).then(res => res.ok ? res.json() : null));
        }
        const w = await weatherCache.get(key);
        if (key !== weatherRegion) return;
        if (!w || w.temperature?.degrees == null) { box.innerHTML = ''; return; }
        const hi = w.currentConditionsHistory?.maxTemperature?.degrees;
        const lo = w.currentConditionsHistory?.minTemperature?.degrees;
        const icon = w.weatherCondition?.iconBaseUri ? `<img src="${esc(w.weatherCondition.iconBaseUri)}.svg" alt="">` : '';
        box.innerHTML = `
          <div class="wc-now">${esc(T.weatherAt(placeName))}</div>
          <div class="wc-now">${icon}<span class="wc-temp">${Math.round(w.temperature.degrees)}°</span></div>
          <div class="wc-desc">${esc(w.weatherCondition?.description?.text || '')}</div>
          ${hi != null && lo != null ? `<div class="wc-desc">${esc(T.hiLo(Math.round(hi), Math.round(lo)))}</div>` : ''}`;
      } catch (e) { box.innerHTML = ''; }
    }
    setWeatherRegion('all');

    // ---------- 카테고리 아이콘 ----------
    $('cats').innerHTML = CATS.map(c => `
      <button type="button" class="cat" data-cat="${c.key}" aria-pressed="${c.key === 'courses'}" style="--ico:${c.color}">
        <span class="cat-ico">${svg(ICON[c.key])}</span>${esc(T.cats[c.key])}
      </button>`).join('');
    $('cats').addEventListener('click', e => {
      const b = e.target.closest('.cat');
      if (!b) return;
      const key = b.dataset.cat;
      if (key === 'courses') setMode('courses');
      else if (key === 'planner') showPlanner();
      else if (key === 'mine') showMine();
      else runNearby(key);
    });

    // 왼쪽 패널 화면 바꾸기
    function setMode(next) {
      mode = next;
      const cat = next === 'search' ? null : next;
      document.querySelectorAll('.cat').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === cat));
      const courses = next === 'courses';
      const planner = next === 'planner';
      $('coursesView').hidden = !courses;
      $('planView').hidden = !planner;
      $('listView').hidden = courses || planner;
      $('researchBtn').hidden = true;
      $('planLegend').hidden = !(planner && plan);
      if (!mapsReady) return;
      infoWindow.close();
      courseLayer.markers.forEach(m => { if (m) m.map = courses ? map : null; });
      courseLayer.lines.forEach(l => l.setMap(courses ? map : null));
      showPlanLayer(planner);
      if (!courses) clearListLayer();
      if (courses) {
        clearListLayer();
        if ($('courseDetail').hidden) { sizeListSpace(); viewing = null; trackScroll(); }
      }
      if (planner && plan) selectDay(planDay, false);
    }

    // ---------- Google 장소 정보 ----------
    async function findPlace(query) {
      const key = query + '|' + LANG;
      if (!placeCache.has(key)) {
        placeCache.set(key, Place.searchByText({
          textQuery: query,
          fields: PLACE_FIELDS,
          language: LANG_CODE,
          region: 'kr',
          maxResultCount: 1
        }).then(({ places }) => places[0] || null));
      }
      return placeCache.get(key);
    }

    // 지금 영업 중인지: Google이 준 영업시간(periods)과 현지 시간으로 계산
    function openState(place) {
      const periods = place.regularOpeningHours?.periods;
      if (!periods?.length || place.utcOffsetMinutes == null) return null;
      if (place.businessStatus && place.businessStatus !== 'OPERATIONAL') return false;
      const WEEK = 7 * 1440;
      const local = new Date(Date.now() + place.utcOffsetMinutes * 60000);
      const now = local.getUTCDay() * 1440 + local.getUTCHours() * 60 + local.getUTCMinutes();
      return periods.some(p => {
        if (!p.close) return true; // 24시간 영업
        const open = p.open.day * 1440 + p.open.hour * 60 + p.open.minute;
        let close = p.close.day * 1440 + p.close.hour * 60 + p.close.minute;
        if (close <= open) close += WEEK;
        return (now >= open && now < close) || (now + WEEK >= open && now + WEEK < close);
      });
    }

    // 장소 이름 아래에 들어갈 주소·영업·평점 HTML
    function placeMetaHtml(place, open) {
      const day = (new Date().getDay() + 6) % 7; // Google은 월요일부터 시작
      const today = place.regularOpeningHours?.weekdayDescriptions?.[day];
      const badge = open === true ? `<span class="badge open">${T.openNow}</span>`
        : open === false ? `<span class="badge closed">${T.closedNow}</span>` : '';
      const rating = place.rating ? `<span>★ ${place.rating.toFixed(1)} ${place.userRatingCount ? T.reviews(place.userRatingCount) : ''}</span>` : '';
      return `
        <div class="addr">${esc(place.formattedAddress)}</div>
        ${(badge || today || rating) ? `<div class="meta">${badge}${today ? `<span>${esc(today)}</span>` : ''}${rating}</div>` : ''}`;
    }

    // 정보 창 열기
    function openInfo(marker, rec, metaHtml, extraHtml = '') {
      const title = document.createElement('div');
      title.className = 'iw-title';
      title.textContent = rec.name;
      const body = document.createElement('div');
      body.className = 'iw';
      body.innerHTML = `${recPhotoSrc(rec) ? `<div class="iw-photo" style="background-image:url('${esc(recPhotoSrc(rec))}')"></div>` : ''}
        ${metaHtml}${extraHtml}
        <div class="actions">${rec.url ? `<a href="${esc(rec.url)}" target="_blank" rel="noopener">${T.openGoogle} ↗</a>` : ''}${saveBtnHtml(rec)}</div>
        ${appButtonsHtml(rec)}`;
      infoWindow.setHeaderContent(title);
      infoWindow.setContent(body);
      infoWindow.open({ map, anchor: marker });
    }

    // 지도를 장소로 옮긴 뒤(다 움직인 다음) 정보 창 열기
    function focusOn(pos, done) {
      if (waitIdle) { waitIdle.remove(); waitIdle = null; }
      const zoom = 15;
      const pxToLat = 360 / (256 * Math.pow(2, zoom)) * Math.cos(pos.lat * Math.PI / 180);
      const target = { lat: pos.lat + $('map').offsetHeight * 0.3 * pxToLat, lng: pos.lng };
      const c = map.getCenter();
      if (isNarrow()) window.scrollTo({ top: 0, behavior: 'smooth' });
      if (Math.abs(map.getZoom() - zoom) < 0.01 && Math.abs(c.lat() - target.lat) < 1e-4 && Math.abs(c.lng() - target.lng) < 1e-4) {
        done();
        return;
      }
      infoWindow.close();
      waitIdle = map.addListener('idle', () => { waitIdle.remove(); waitIdle = null; done(); });
      map.setZoom(zoom);
      map.panTo(target);
    }

    function makeMarker(pos, label, color, title, onClick) {
      const el = document.createElement('div');
      el.className = 'mk';
      el.style.background = color;
      el.textContent = label;
      const marker = new AdvancedMarkerElement({ map, position: pos, title, content: el, gmpClickable: true });
      marker.addEventListener('gmp-click', onClick);
      return marker;
    }

    function clearCourseLayer() {
      courseLayer.markers.forEach(m => { if (m) m.map = null; });
      courseLayer.lines.forEach(l => l.setMap(null));
      courseLayer = { markers: [], lines: [] };
    }
    function clearListLayer() {
      listLayer.markers.forEach(m => { m.map = null; });
      listLayer = { markers: [] };
    }

    // ---------- Google 대중교통 경로 (Routes API · Compute Routes) ----------
    async function transitRoute(a, b) {
      const res = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
          'X-Goog-FieldMask': 'routes.duration,routes.distanceMeters,routes.polyline.geoJsonLinestring,routes.legs.steps.travelMode,routes.legs.steps.transitDetails.transitLine'
        },
        body: JSON.stringify({
          origin: { placeId: a.id },
          destination: { placeId: b.id },
          travelMode: 'TRANSIT',
          polylineEncoding: 'GEO_JSON_LINESTRING',
          languageCode: LANG_CODE
        })
      });
      if (!res.ok) throw new Error('Routes ' + res.status);
      const data = await res.json();
      return data.routes?.[0] || null;
    }

    function directionsUrl(a, b) {
      const p = new URLSearchParams({
        api: '1',
        origin: a.displayName, origin_place_id: a.id,
        destination: b.displayName, destination_place_id: b.id,
        travelmode: 'transit'
      });
      return 'https://www.google.com/maps/dir/?' + p.toString();
    }

    function segHtml(route, a, b) {
      const link = a && b ? ` · <a href="${esc(directionsUrl(a, b))}" target="_blank" rel="noopener">${T.directions} ↗</a>` : '';
      if (route === 'loading') return `<span class="loading">${T.routeLoading}</span>`;
      if (route === 'error') return `<span class="error">${T.routeError}</span>${link}`;
      if (!route) return `<span class="loading">${T.routeNone}</span>${link}`;
      const lines = (route.legs?.[0]?.steps || [])
        .filter(s => s.travelMode === 'TRANSIT' && s.transitDetails?.transitLine)
        .map(s => s.transitDetails.transitLine)
        .filter((l, i, all) => i === 0 || (all[i - 1].nameShort || all[i - 1].name) !== (l.nameShort || l.name))
        .map(l => `<span class="line" style="background:${esc(l.color || '#555')};color:${esc(l.textColor || '#fff')}">${esc(l.nameShort || l.name)}</span>`)
        .join('');
      return `
        <div class="seg-main">🚇 ${fmtDur(parseInt(route.duration, 10))} · ${fmtKm(route.distanceMeters || 0)}</div>
        ${lines ? `<div class="lines">${lines}</div>` : `<div>${T.walk}</div>`}
        <a href="${esc(directionsUrl(a, b))}" target="_blank" rel="noopener">${T.directions} ↗</a>`;
    }

    // ---------- 지역별 사진 코스 카드 ----------
    let region = 'all';

    function courseCardHtml(c, i) {
      return `
        <li>
          <button type="button" class="course-card" data-course="${i}" style="--c:${c.color}">
            <div class="cover" style="background-image:url('${esc(photoUrl(c.cover))}')">
              ${creditHtml(c.cover)}
              <span class="cover-num en">Course ${String(i + 1).padStart(2, '0')}</span>
              <h3>${esc(c.name[LANG])}</h3>
            </div>
            <div class="card-body">
              <p>${esc(c.desc[LANG])}</p>
              <div class="course-meta">
                <span class="chip">${T.stops(c.stops.length)}</span>
                <span class="chip">${esc(c.time[LANG])}</span>
              </div>
            </div>
          </button>
        </li>`;
    }

    // 지역별로 묶어서: 지역 제목 + 소개 + 그 지역 코스들
    function renderCourses() {
      $('regionFilter').innerHTML = Object.entries(REGIONS).map(([key, r]) =>
        `<button type="button" data-region="${key}" aria-pressed="${key === region}">${esc(r.name[LANG])}</button>`).join('');
      const keys = Object.keys(REGIONS).filter(k => k !== 'all' && (region === 'all' || region === k));
      $('courseList').innerHTML = keys.map(key => {
        const r = REGIONS[key];
        const cards = COURSES.map((c, i) => c.region === key ? courseCardHtml(c, i) : '').join('');
        const count = COURSES.filter(c => c.region === key).length;
        return `
          <li class="region-sec" data-region="${key}">
            <div class="region-head">
              <h3>📍 ${esc(r.name[LANG])} ${LANG !== 'en' ? `<span class="en">${esc(r.name.en)}</span>` : ''}<small>${T.courseCount(count)}</small></h3>
              <p>${esc(r.intro[LANG])}</p>
            </div>
            <ul class="course-list">${cards}</ul>
          </li>`;
      }).join('');
    }
    renderCourses();

    function showRegionOnMap(key = region) {
      if (!mapsReady) return;
      const r = REGIONS[key];
      if (r.bounds) {
        map.fitBounds(r.bounds, 0);
      } else {
        map.panTo(r.center);
        map.setZoom(r.zoom);
      }
    }

    // ---------- 목록을 스크롤하면 지금 보고 있는 지역으로 지도가 이동 ----------
    let viewing = 'all';
    let scrollTicking = false;

    function trackScroll() {
      scrollTicking = false;
      if (mode !== 'courses' || region !== 'all' || $('courseListWrap').hidden) return;
      // 이 선을 지나 위로 올라간 지역 제목 중 마지막 것이 '지금 보는 지역'
      const line = isNarrow()
        ? document.querySelector('.map-wrap').getBoundingClientRect().bottom + 80
        : side.getBoundingClientRect().top + 60;
      let current = 'all';
      document.querySelectorAll('.region-sec').forEach(sec => {
        if (sec.getBoundingClientRect().top <= line) current = sec.dataset.region;
      });
      if (current === viewing) return;
      viewing = current;
      document.querySelectorAll('#regionFilter button').forEach(b =>
        b.classList.toggle('viewing', b.dataset.region === current && current !== 'all'));
      setWeatherRegion(current);
      showRegionOnMap(current);
    }
    function onScroll() {
      if (!scrollTicking) { scrollTicking = true; requestAnimationFrame(trackScroll); }
    }
    side.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('scroll', onScroll, { passive: true });

    // 마지막 지역(제주)의 제목도 위까지 올라올 수 있게 목록 아래에 빈 공간을 둠
    function sizeListSpace() {
      const list = $('courseList');
      const secs = list.querySelectorAll('.region-sec');
      const last = secs[secs.length - 1];
      if (region !== 'all' || !last || $('courseListWrap').hidden || mode !== 'courses') { list.style.paddingBottom = ''; return; }
      const room = isNarrow()
        ? window.innerHeight - document.querySelector('.map-wrap').offsetHeight - 100
        : side.clientHeight - 70;
      list.style.paddingBottom = Math.max(0, room - last.offsetHeight - $('credits').offsetHeight - 24) + 'px';
    }
    sizeListSpace();
    window.addEventListener('resize', sizeListSpace);
    window.addEventListener('load', sizeListSpace);

    $('regionFilter').addEventListener('click', e => {
      const btn = e.target.closest('button[data-region]');
      if (!btn) return;
      region = btn.dataset.region;
      viewing = region;
      renderCourses();
      sizeListSpace();
      setWeatherRegion(region);
      showRegionOnMap();
    });
    $('courseList').addEventListener('click', e => {
      const btn = e.target.closest('.course-card');
      if (btn) openCourse(Number(btn.dataset.course));
    });

    // ---------- 코스 열기 ----------
    let listScroll = null;
    let lastCourse = null;
    async function openCourse(ci) {
      const token = ++courseToken;
      const course = COURSES[ci];
      const lang = LANG;
      lastCourse = ci;

      if (!$('courseListWrap').hidden) listScroll = { panel: side.scrollTop, page: window.scrollY };
      $('courseListWrap').hidden = true;
      sizeListSpace();
      setWeatherRegion(course.region);
      const detail = $('courseDetail');
      detail.hidden = false;
      detail.style.setProperty('--course', course.color);
      detail.innerHTML = `
        <button type="button" class="back" id="backBtn">${T.back}</button>
        <div class="detail-cover">
          <div class="cover" style="--c:${course.color};background-image:url('${esc(photoUrl(course.cover))}')">
            ${creditHtml(course.cover)}
            <span class="cover-num en">Course ${String(ci + 1).padStart(2, '0')}</span>
            <h3>${esc(course.name[lang])}</h3>
          </div>
          <div class="card-body">
            <p>${esc(course.desc[lang])}</p>
            <div class="course-meta"><span class="chip">📍 ${esc(REGIONS[course.region].name[lang])}</span><span class="chip">${T.stops(course.stops.length)}</span><span class="chip">${esc(course.time[lang])}</span></div>
            <div class="total" id="totalBox">${T.routeLoading}</div>
          </div>
        </div>
        <ol class="timeline" id="timeline">
          ${course.stops.map((s, i) => `
            <li>
              <button type="button" class="stop-btn" data-stop="${i}">
                <div class="thumb-col">
                  <div class="thumb" style="background-image:url('${esc(photoUrl(s.photo))}')"><span class="num">${i + 1}</span></div>
                  ${creditHtml(s.photo, 'thumb-credit')}
                </div>
                <div id="stop${i}"><span class="loading">${T.loading}</span></div>
              </button>
            </li>
            ${i < course.stops.length - 1 ? `<li class="seg" id="seg${i}">${segHtml('loading')}</li>` : ''}`).join('')}
        </ol>
        <p class="note">${T.transitNote}</p>`;
      $('backBtn').addEventListener('click', closeCourse);
      if (isNarrow()) window.scrollTo({ top: 0 }); else side.scrollTop = 0;

      clearCourseLayer();
      if (mapsReady) infoWindow.close();
      // 지도나 장소 정보를 쓸 수 없으면 링크 모드로
      if (!mapsReady || placesDown) { renderCourseLinks(course); return; }

      // 1) 장소 정보 가져오기
      const places = await Promise.all(course.stops.map(s => findPlace(s.query).catch(() => null)));
      if (token !== courseToken) return;
      if (places.every(p => !p)) { placesDown = true; renderCourseLinks(course); return; }
      const opens = places.map(p => p ? openState(p) : null);

      const bounds = new google.maps.LatLngBounds();
      places.forEach((place, i) => {
        const box = $('stop' + i);
        const stop = course.stops[i];
        const tipHtml = `<p class="tip"><b>${T.tip}</b>${esc(stop.tip[lang])}</p>`;
        if (!place) {
          box.innerHTML = `<span class="error">${T.placeError}</span>${tipHtml}`;
          courseLayer.markers.push(null);
          return;
        }
        const rec = remember(place, stop.photo);
        box.innerHTML = `
          <div class="name-row"><div class="stop-name">${esc(rec.name)}</div>${saveBtnHtml(rec)}</div>
          ${placeMetaHtml(place, opens[i])}
          ${distHtml(rec)}
          ${tipHtml}
          <div class="actions"><span>⏱ ${T.stay(stop.stay)}</span>
            <a class="gmap-link" href="${esc(rec.url)}" target="_blank" rel="noopener">${T.openGoogle} ↗</a></div>
          ${appButtonsHtml(rec)}`;
        const show = () => {
          highlightStop(i);
          openInfo(courseLayer.markers[i], rec, placeMetaHtml(place, opens[i]), tipHtml);
        };
        const marker = makeMarker(place.location, String(i + 1), course.color, rec.name, show);
        marker.zIndex = 10;
        courseLayer.markers.push(marker);
        bounds.extend(place.location);
        box.closest('.stop-btn').onclick = () => focusOn(rec, show);
      });
      if (!bounds.isEmpty()) map.fitBounds(bounds, 70);

      // 2) 장소 사이 대중교통 경로 가져오기
      let total = 0, missing = false;
      await Promise.all(places.slice(0, -1).map(async (a, i) => {
        const b = places[i + 1];
        const segEl = $('seg' + i);
        if (!a || !b) { segEl.innerHTML = segHtml('error'); missing = true; return; }
        let route;
        try { route = await transitRoute(a, b); } catch (e) { route = 'error'; }
        if (token !== courseToken) return;
        segEl.innerHTML = segHtml(route, a, b);
        if (!route || route === 'error') { missing = true; return; }
        total += parseInt(route.duration, 10);
        const coords = route.polyline?.geoJsonLinestring?.coordinates || [];
        const line = new google.maps.Polyline({
          map: mode === 'courses' ? map : null,
          path: coords.map(([lng, lat]) => ({ lat, lng })),
          strokeColor: course.color,
          strokeOpacity: 0.85,
          strokeWeight: 5
        });
        courseLayer.lines.push(line);
      }));
      if (token !== courseToken) return;
      $('totalBox').innerHTML = total
        ? `🚇 ${T.total}: <b>${fmtDur(total)}</b>${missing ? ` · ${T.totalPartial}` : ''}`
        : T.totalPartial;
    }

    // 링크 모드 코스: 지니맵 정보(이름·사진·팁·위치) + Google 지도·네이버 지도·티맵 버튼
    function renderCourseLinks(course) {
      $('totalBox').textContent = T.linkCourseNote;
      const recs = course.stops.map(s => spotRec(s.photo));
      const bounds = mapsReady ? new google.maps.LatLngBounds() : null;
      recs.forEach((rec, i) => {
        const stop = course.stops[i];
        const tipHtml = `<p class="tip"><b>${T.tip}</b>${esc(stop.tip[LANG])}</p>`;
        $('stop' + i).innerHTML = `
          <div class="name-row"><div class="stop-name">${esc(rec.name)}</div>${saveBtnHtml(rec)}</div>
          ${distHtml(rec)}
          ${tipHtml}
          <div class="actions"><span>⏱ ${T.stay(stop.stay)}</span></div>
          ${appButtonsHtml(rec, true)}`;
        if (i < recs.length - 1) {
          $('seg' + i).innerHTML = `<a href="${esc(googleDirUrl(stop.query, course.stops[i + 1].query))}" target="_blank" rel="noopener">🚇 ${T.directions} (Google) ↗</a>`;
        }
        // 지도는 뜨는데 장소 정보만 못 받는 경우: 지니맵이 아는 위치로 마커 표시
        if (mapsReady) {
          const show = () => { highlightStop(i); openInfo(courseLayer.markers[i], rec, '', tipHtml); };
          courseLayer.markers.push(makeMarker({ lat: rec.lat, lng: rec.lng }, String(i + 1), course.color, rec.name, show));
          bounds.extend({ lat: rec.lat, lng: rec.lng });
          $('stop' + i).closest('.stop-btn').onclick = () => focusOn(rec, show);
        }
      });
      if (mapsReady) {
        courseLayer.lines.push(new google.maps.Polyline({ map, path: recs.map(r => ({ lat: r.lat, lng: r.lng })), ...lineOptions(1, true) }));
        map.fitBounds(bounds, 70);
      }
    }

    function highlightStop(i) {
      document.querySelectorAll('.stop-btn').forEach((b, j) => b.classList.toggle('active', i === j));
      courseLayer.markers.forEach((m, j) => { if (m) m.content.classList.toggle('active', i === j); });
    }

    // 코스를 닫으면 보던 목록 위치로 돌아가고, 지도도 그 지역으로
    function closeCourse() {
      courseToken++;
      clearCourseLayer();
      if (mapsReady) infoWindow.close();
      $('courseDetail').hidden = true;
      $('courseListWrap').hidden = false;
      sizeListSpace();
      if (listScroll) {
        side.scrollTop = listScroll.panel;
        if (isNarrow()) window.scrollTo(0, listScroll.page);
      }
      if (region === 'all') {
        viewing = null;
        trackScroll();
      } else {
        setWeatherRegion(region);
        showRegionOnMap();
      }
    }

    // ---------- 목록 화면 (주변 찾기 · 검색 · 내 여행) ----------
    function startList(title, hint, statusHtml) {
      const token = ++listToken;
      $('listTitle').textContent = title;
      $('listHint').textContent = hint;
      $('listStatus').innerHTML = statusHtml || '';
      $('resultList').innerHTML = '';
      $('catBanner').hidden = true;
      clearListLayer();
      if (mapsReady) infoWindow.close();
      if (isNarrow()) window.scrollTo({ top: 0 }); else side.scrollTop = 0;
      return token;
    }

    // Google 장소 목록을 카드 + 마커로 그리기
    function renderPlaces(places, color, iconKey) {
      const list = $('resultList');
      const bounds = new google.maps.LatLngBounds();
      places.forEach((place, i) => {
        const rec = remember(place, undefined, iconKey === 'attraction');
        const open = openState(place);
        const letter = String.fromCharCode(65 + i);
        const li = document.createElement('li');
        li.innerHTML = `
          <button type="button" class="result-btn" style="--course:${color}">
            <div class="thumb-col">${thumbHtml(rec, letter, color, iconKey)}</div>
            <div>
              <div class="name-row"><div class="stop-name">${esc(rec.name)}</div>${saveBtnHtml(rec)}</div>
              ${placeMetaHtml(place, open)}
              ${distHtml(rec)}
              <div class="actions"><a class="gmap-link" href="${esc(rec.url)}" target="_blank" rel="noopener">${T.openGoogle} ↗</a>
                ${iconKey !== 'attraction' && !rec.gphoto ? `<a class="gmap-link" href="${esc(naverSearchUrl(rec.name))}" target="_blank" rel="noopener">${T.photosOnNaver}</a>` : ''}</div>
              ${appButtonsHtml(rec)}
            </div>
          </button>`;
        list.appendChild(li);
        // 관광명소인데 사진이 없으면 Wikimedia Commons에서 그 장소 사진을 찾아 채우기
        if (iconKey === 'attraction' && !rec.photo && !rec.gphoto) {
          commonsPhoto(rec.name, rec.lat, rec.lng).then(ph => {
            if (!ph || !li.isConnected) return;
            rec.wphoto = ph;
            li.querySelector('.thumb-col').innerHTML = thumbHtml(rec, letter, color, iconKey);
          });
        }
        const show = () => {
          list.querySelectorAll('.result-btn').forEach((b, j) => b.classList.toggle('active', i === j));
          listLayer.markers.forEach((m, j) => m.content.classList.toggle('active', i === j));
          openInfo(listLayer.markers[i], rec, placeMetaHtml(place, open));
        };
        listLayer.markers.push(makeMarker(place.location, letter, color, rec.name, show));
        bounds.extend(place.location);
        li.querySelector('button').addEventListener('click', () => focusOn(rec, show));
      });
      return bounds;
    }

    // 주변 찾기 (Google Places · Nearby Search)
    let nearbyCat = null;
    async function runNearby(catKey) {
      const cat = CATS.find(c => c.key === catKey);
      nearbyCat = catKey;
      setMode(catKey);
      const token = startList(T.nearbyTitle(T.cats[catKey]), T.nearbyHint, `<p class="loading">${T.searching}</p>`);

      // 목록 위 분위기 사진 띠 ("예시 사진" 표시 + 출처)
      const bp = CAT_PHOTOS[catKey];
      if (bp) {
        const banner = $('catBanner');
        banner.style.backgroundImage = `url('${bp.src}')`;
        banner.title = T.exampleTip;
        banner.innerHTML = `
          <span class="example-tag" title="${esc(T.exampleTip)}">${esc(T.examplePhoto)}</span>
          <a class="credit" href="${esc(bp.page)}" target="_blank" rel="noopener" title="${esc(bp.by)} · ${esc(bp.lic)}">📷 ${esc(bp.by)}</a>
          <h2>${svg(ICON[catKey], 26)}${esc(T.cats[catKey])}</h2>`;
        banner.hidden = false;
      }
      // 링크 모드: 지도 앱에서 "지역 + 종류" 검색 결과를 보도록
      const nearbyLinks = () => {
        const r = currentRegion();
        $('listStatus').innerHTML = `<p class="note">${esc(T.nearbyLinkText(REGIONS[r].name[LANG], T.cats[catKey]))}</p>
          ${searchLinksHtml(REGIONS[r].name.ko + ' ' + TEXT.ko.cats[catKey], REGIONS[r].name.en + ' ' + TEXT.en.cats[catKey])}`;
      };
      if (!mapsReady || placesDown) { nearbyLinks(); return; }

      // 지도가 너무 넓게 보이면(나라 전체) 먼저 지금 지역으로 확대
      if (map.getZoom() < 11) {
        const key = viewing && viewing !== 'all' ? viewing : 'seoul';
        map.setCenter(REGIONS[key].center);
        map.setZoom(14);
        await new Promise(r => google.maps.event.addListenerOnce(map, 'idle', r));
      }
      const center = map.getCenter();
      const ne = map.getBounds().getNorthEast();
      // 날씨 카드도 가장 가까운 지역으로 (60km 안)
      const nearest = Object.keys(PLAN_DAYS)
        .map(k => ({ k, km: kmBetween(center.toJSON(), REGIONS[k].center) }))
        .sort((a, b) => a.km - b.km)[0];
      if (nearest.km < 60) setWeatherRegion(nearest.k);
      const radius = Math.min(5000, Math.max(800, kmBetween(center.toJSON(), ne.toJSON()) * 1000 * 0.8));

      let places;
      try {
        ({ places } = await Place.searchNearby({
          fields: PLACE_FIELDS,
          locationRestriction: { center, radius },
          includedPrimaryTypes: [cat.type],
          maxResultCount: 15,
          language: LANG_CODE,
          region: 'kr'
        }));
      } catch (e) {
        if (token === listToken) { placesDown = true; nearbyLinks(); }
        return;
      }
      if (token !== listToken) return;
      if (!places.length) { $('listStatus').innerHTML = `<p class="loading">${T.nearbyEmpty}</p>`; return; }
      $('listStatus').innerHTML = '';
      const bounds = renderPlaces(places, cat.color, catKey);
      // 찾은 장소가 모두 지도 안에 보이도록
      if (places.length > 1) map.fitBounds(bounds, 60);
      $('researchBtn').hidden = true;
    }
    $('researchBtn').addEventListener('click', () => { if (nearbyCat) runNearby(nearbyCat); });

    // 장소 검색 (Google Places · Text Search)
    $('searchForm').addEventListener('submit', e => {
      e.preventDefault();
      const q = $('searchInput').value.trim();
      if (q) runSearch(q);
    });
    async function runSearch(q) {
      setMode('search');
      const token = startList(T.searchTitle(q), T.searchHint, `<p class="loading">${T.searching}</p>`);
      // 링크 모드: 지도 앱에서 같은 검색어로 찾아보기
      const searchLinks = () => {
        $('listStatus').innerHTML = `<p class="note">${esc(T.searchLinkText(q))}</p>${searchLinksHtml(q, q)}`;
      };
      if (!mapsReady || placesDown) { searchLinks(); return; }
      let places;
      try {
        ({ places } = await Place.searchByText({
          textQuery: q,
          fields: PLACE_FIELDS,
          language: LANG_CODE,
          region: 'kr',
          maxResultCount: 10,
          locationRestriction: KOREA_BOUNDS
        }));
      } catch (e) {
        if (token === listToken) { placesDown = true; searchLinks(); }
        return;
      }
      if (token !== listToken) return;
      if (!places.length) { $('listStatus').innerHTML = `<p class="loading">${T.searchEmpty}</p>`; return; }
      $('listStatus').innerHTML = '';
      const bounds = renderPlaces(places, '#3d6af2', 'attraction');
      if (places.length === 1) { map.setCenter(places[0].location); map.setZoom(14); }
      else map.fitBounds(bounds, 70);
    }

    // 내 여행 (찜한 장소)
    function showMine() {
      setMode('mine');
      startList(T.mineTitle, T.mineHint, saved.length ? '' : `<p class="loading">${T.mineEmpty}</p>`);
      if (!saved.length) return;
      const list = $('resultList');
      const bounds = mapsReady ? new google.maps.LatLngBounds() : null;
      saved.forEach((rec, i) => {
        placeIndex.set(rec.id, rec);
        const li = document.createElement('li');
        li.innerHTML = `
          <button type="button" class="result-btn" style="--course:#ff6b6b">
            <div class="thumb-col">${thumbHtml(rec, i + 1, '#ff6b6b', rec.kind || 'mine')}</div>
            <div>
              <div class="name-row"><div class="stop-name">${esc(rec.name)}</div>${saveBtnHtml(rec)}</div>
              <div class="addr">${esc(rec.address)}</div>
              ${distHtml(rec)}
              <div class="actions">${rec.url ? `<a class="gmap-link" href="${esc(rec.url)}" target="_blank" rel="noopener">${T.openGoogle} ↗</a>` : ''}</div>
              ${appButtonsHtml(rec)}
            </div>
          </button>`;
        list.appendChild(li);
        if (!mapsReady) return;
        const pos = { lat: rec.lat, lng: rec.lng };
        const show = () => {
          list.querySelectorAll('.result-btn').forEach((b, j) => b.classList.toggle('active', i === j));
          listLayer.markers.forEach((m, j) => m.content.classList.toggle('active', i === j));
          openInfo(listLayer.markers[i], rec, `<div class="addr">${esc(rec.address)}</div>`);
        };
        listLayer.markers.push(makeMarker(pos, String(i + 1), '#ff6b6b', rec.name, show));
        bounds.extend(pos);
        li.querySelector('button').addEventListener('click', () => focusOn(rec, show));
      });
      if (bounds && !bounds.isEmpty()) {
        if (saved.length === 1) { map.setCenter(bounds.getCenter()); map.setZoom(14); }
        else map.fitBounds(bounds, 70);
      }
    }

    // ---------- 자동 추천 일정 ----------
    // 지니맵 명소(하루 3곳) 사이사이에 Google에서 찾은 근처 인기 음식점·카페를 넣어 날짜별 일정을 만들어요.
    const DAY_COLORS = ['#3d6af2', '#12b5a0', '#f59e0b'];
    const KIND_COLORS = { sight: '#3d6af2', restaurant: '#f0544f', cafe: '#b7791f' };
    const KIND_ICON = { sight: 'attraction', restaurant: 'restaurant', cafe: 'cafe' };
    let plan = null;      // { region, len, days: [[항목, …], …] }
    let planDay = 0;
    let planLayer = { markers: [], lines: [] };
    let planToken = 0;
    let planRegion = null, planLen = 1;
    const routeCache = new Map();

    function showPlanner() {
      if (!planRegion) planRegion = viewing && viewing !== 'all' ? viewing : 'seoul';
      setMode('planner');
      renderPlanForm();
      $('planForm').hidden = !!plan;
      $('planResult').hidden = !plan;
      if (plan) setWeatherRegion(plan.region);
      if (isNarrow()) window.scrollTo({ top: 0 }); else side.scrollTop = 0;
    }
    $('planCta').addEventListener('click', showPlanner);

    function renderPlanForm() {
      $('planRegion').innerHTML = Object.keys(PLAN_DAYS).map(k =>
        `<button type="button" data-v="${k}" aria-pressed="${k === planRegion}">${esc(REGIONS[k].name[LANG])}</button>`).join('');
      $('planLength').innerHTML = T.lengths.map((t, i) =>
        `<button type="button" data-v="${i}" aria-pressed="${i === planLen}">${esc(t)}</button>`).join('');
    }
    $('planRegion').addEventListener('click', e => {
      const b = e.target.closest('button[data-v]');
      if (!b) return;
      planRegion = b.dataset.v;
      renderPlanForm();
      setWeatherRegion(planRegion);
      showRegionOnMap(planRegion);
    });
    $('planLength').addEventListener('click', e => {
      const b = e.target.closest('button[data-v]');
      if (!b) return;
      planLen = Number(b.dataset.v);
      renderPlanForm();
    });
    $('makePlanBtn').addEventListener('click', buildPlan);

    // 명소 근처에서 평점·리뷰 수가 좋은 곳 하나 고르기 (이미 고른 곳은 빼고)
    const placeScore = p => (p.rating || 0) * Math.log10((p.userRatingCount || 0) + 10);
    async function nearbyBest(location, type, usedIds) {
      for (const radius of [700, 2000]) {
        let places = [];
        try {
          ({ places } = await Place.searchNearby({
            fields: PLACE_FIELDS,
            locationRestriction: { center: location, radius },
            includedPrimaryTypes: [type],
            maxResultCount: 12,
            language: LANG_CODE,
            region: 'kr'
          }));
        } catch (e) { return null; }
        const ok = places.filter(p => !usedIds.has(p.id) && p.rating && (!p.businessStatus || p.businessStatus === 'OPERATIONAL'));
        const good = ok.filter(p => p.rating >= 4.0); // 평점 4.0 이상을 먼저
        const pool = good.length ? good : ok;
        if (pool.length) return pool.sort((a, b) => placeScore(b) - placeScore(a))[0];
      }
      return null;
    }

    // 링크 모드 일정: 지니맵 명소 + "근처 맛집·카페 찾아보기" 버튼
    function buildLinkPlan() {
      const region = planRegion, len = planLen;
      const days = PLAN_DAYS[region].slice(0, len + 1).map(([k1, k2, k3]) => [
        { kind: 'sight', key: k1, rec: spotRec(k1) },
        { kind: 'restaurant', meal: 'lunch', near: k1, link: true },
        { kind: 'sight', key: k2, rec: spotRec(k2) },
        { kind: 'cafe', meal: 'cafe', near: k2, link: true },
        { kind: 'sight', key: k3, rec: spotRec(k3) },
        { kind: 'restaurant', meal: 'dinner', near: k3, link: true }
      ]);
      $('makePlanBtn').disabled = false;
      $('planStatus').innerHTML = '';
      setWeatherRegion(region);
      plan = { region, len, days, linkOnly: true };
      planDay = 0;
      renderPlanResult();
      if (mapsReady) drawPlanLayer();
      selectDay(0);
    }

    async function buildPlan() {
      if (!mapsReady || placesDown) { buildLinkPlan(); return; }
      const token = ++planToken;
      const btn = $('makePlanBtn');
      btn.disabled = true;
      $('planStatus').innerHTML = `<p class="loading">${T.planning}</p>`;
      setWeatherRegion(planRegion);

      const region = planRegion, len = planLen;
      const dayKeys = PLAN_DAYS[region].slice(0, len + 1);
      // 1) 명소 정보 (Google Places)
      const sights = await Promise.all(dayKeys.map(keys =>
        Promise.all(keys.map(k => findPlace(spotInfo(k).query).catch(() => null)))));
      if (token !== planToken) return;
      if (sights.flat().every(p => !p)) { placesDown = true; buildLinkPlan(); return; }
      const used = new Set(sights.flat().filter(Boolean).map(p => p.id));

      // 2) 명소 근처 점심 · 카페 · 저녁 (Google Places Nearby Search)
      const days = [];
      for (let d = 0; d < dayKeys.length; d++) {
        const [k1, k2, k3] = dayKeys[d];
        const [s1, s2, s3] = sights[d];
        const pick = async (s, type) => {
          if (!s) return null;
          const p = await nearbyBest(s.location, type, used);
          if (p) used.add(p.id);
          return p;
        };
        const lunch = await pick(s1, 'restaurant');
        const cafe = await pick(s2, 'cafe');
        const dinner = await pick(s3, 'restaurant');
        if (token !== planToken) return;
        days.push([
          { kind: 'sight', key: k1, place: s1 },
          { kind: 'restaurant', meal: 'lunch', place: lunch },
          { kind: 'sight', key: k2, place: s2 },
          { kind: 'cafe', meal: 'cafe', place: cafe },
          { kind: 'sight', key: k3, place: s3 },
          { kind: 'restaurant', meal: 'dinner', place: dinner }
        ].filter(it => it.kind === 'sight' || it.place).map(it => {
          if (it.place) {
            it.rec = remember(it.place, it.kind === 'sight' ? it.key : undefined);
            it.rec.kind = KIND_ICON[it.kind];
          }
          return it;
        }));
      }
      if (token !== planToken) return;
      btn.disabled = false;
      $('planStatus').innerHTML = '';
      plan = { region, len, days };
      planDay = 0;
      renderPlanResult();
      drawPlanLayer();
      selectDay(0);
    }

    function renderPlanResult() {
      const all = plan.days.flat().filter(it => it.rec);
      const count = k => all.filter(it => it.kind === k).length;
      let dist = 0;
      plan.days.forEach(day => {
        const recs = day.filter(it => it.rec).map(it => it.rec);
        for (let i = 1; i < recs.length; i++) dist += kmBetween(recs[i - 1], recs[i]);
      });
      const rName = REGIONS[plan.region].name[LANG];
      $('planResult').innerHTML = `
        <div class="plan-summary">
          <h3>📍 ${esc(T.planFor(rName, T.lengths[plan.len]))}</h3>
          <div class="stats">
            <div class="plan-badge">${esc(T.lengthShort[plan.len])}</div>
            <ul>
              <li>${esc(plan.linkOnly
                ? T.planCountLink(count('sight'), plan.days.flat().filter(it => it.link).length)
                : T.planCount(all.length, count('sight'), count('restaurant'), count('cafe')))}</li>
              <li>${esc(T.planArea(rName))}</li>
              <li>${esc(T.planDist(Math.round(dist) + ' km'))}</li>
            </ul>
          </div>
          <button type="button" class="link-btn" id="remakeBtn">${T.remake}</button>
        </div>
        <div class="day-bar">
          ${plan.days.map((_, d) => `<button type="button" class="day-tab" data-day="${d}" aria-pressed="${d === planDay}">${esc(T.dayN(d + 1))}</button>`).join('')}
          <button type="button" class="parking-btn" id="parkingBtn"><span class="cat-ico" style="width:24px;height:24px;border:0;color:#475569">${svg(ICON.parking, 18)}</span>${T.nearParking}</button>
        </div>
        <div id="planDayList"></div>
        <p class="note">${T.planNote}</p>`;
      $('planForm').hidden = true;
      $('planResult').hidden = false;
      $('remakeBtn').addEventListener('click', () => { $('planForm').hidden = false; $('planResult').hidden = true; renderPlanForm(); });
      $('planResult').querySelector('.day-bar').addEventListener('click', e => {
        const b = e.target.closest('.day-tab');
        if (b) selectDay(Number(b.dataset.day));
      });
      $('parkingBtn').addEventListener('click', async () => {
        // 그날 가운데 명소 근처 주차장 찾기
        const mid = plan.days[planDay].filter(it => it.rec)[Math.floor(plan.days[planDay].length / 2)] || plan.days[planDay].find(it => it.rec);
        if (!mid) return;
        // 링크 모드: 네이버 지도에서 "명소 이름 + 주차장" 검색
        if (!mapsReady || placesDown) {
          const ko = mid.key ? SPOT_NAMES[mid.key][0] : mid.rec.name;
          window.open(naverSearchUrl(ko + ' 주차장'), '_blank', 'noopener');
          return;
        }
        map.setCenter({ lat: mid.rec.lat, lng: mid.rec.lng });
        map.setZoom(15);
        await new Promise(r => google.maps.event.addListenerOnce(map, 'idle', r));
        runNearby('parking');
      });
      // 지도 위 날짜 안내표
      $('planLegend').innerHTML = plan.days.map((_, d) =>
        `<span style="color:${DAY_COLORS[d]}"><i style="--d:${DAY_COLORS[d]};border-top-style:${['solid', 'dashed', 'dotted'][d]}"></i>${esc(T.dayN(d + 1))}</span>`).join('');
      $('planLegend').hidden = mode !== 'planner';
    }

    // 날짜별 선 모양: 1일차 실선 · 2일차 점선 · 3일차 동그라미 점선
    function lineOptions(d, active) {
      const color = DAY_COLORS[d], op = active ? 1 : 0.3;
      if (d === 0) return { strokeColor: color, strokeOpacity: 0.9 * op, strokeWeight: 4, icons: [] };
      if (d === 1) return { strokeOpacity: 0, icons: [{ icon: { path: 'M 0,-1 0,1', strokeColor: color, strokeOpacity: op, strokeWeight: 4, scale: 3 }, offset: '0', repeat: '14px' }] };
      return { strokeOpacity: 0, icons: [{ icon: { path: google.maps.SymbolPath.CIRCLE, fillColor: color, fillOpacity: op, strokeOpacity: 0, scale: 3 }, offset: '0', repeat: '11px' }] };
    }

    function drawPlanLayer() {
      planLayer.markers.flat().forEach(m => { m.map = null; });
      planLayer.lines.forEach(l => l.setMap(null));
      planLayer = { markers: [], lines: [] };
      plan.days.forEach((day, d) => {
        const items = day.filter(it => it.rec);
        planLayer.markers.push(items.map((it, i) => makeMarker({ lat: it.rec.lat, lng: it.rec.lng }, String(i + 1), DAY_COLORS[d], it.rec.name, () => {
          if (planDay !== d) selectDay(d, false);
          openPlanItem(d, i);
        })));
        planLayer.lines.push(new google.maps.Polyline({ map, path: items.map(it => ({ lat: it.rec.lat, lng: it.rec.lng })), zIndex: d === planDay ? 5 : 1, ...lineOptions(d, true) }));
      });
    }

    function showPlanLayer(visible) {
      if (!plan) return;
      planLayer.markers.flat().forEach(m => { m.map = visible ? map : null; });
      planLayer.lines.forEach(l => l.setMap(visible ? map : null));
      $('planLegend').hidden = !visible;
    }

    function openPlanItem(d, i) {
      const it = plan.days[d].filter(x => x.rec)[i];
      document.querySelectorAll('#planDayList .stop-btn').forEach(b => b.classList.toggle('active', b.dataset.rid === it.rec.id));
      planLayer.markers[d].forEach((m, j) => m.content.classList.toggle('active', i === j));
      const tip = it.kind === 'sight' ? `<p class="tip"><b>${T.tip}</b>${esc(spotInfo(it.key).tip[LANG])}</p>` : '';
      openInfo(planLayer.markers[d][i], it.rec, it.place ? placeMetaHtml(it.place, openState(it.place)) : '', tip);
    }

    function selectDay(d, fit = true) {
      planDay = d;
      document.querySelectorAll('.day-tab').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.day) === d));
      const day = plan.days[d];
      const color = DAY_COLORS[d];
      let n = 0;
      $('planDayList').innerHTML = `
        <h3 class="day-head" style="color:${color}">Day ${d + 1}</h3>
        <ol class="timeline" style="--course:${color}">
          ${day.map((it, idx) => {
            const kc = KIND_COLORS[it.kind];
            const kindTag = `<span class="kind" style="--k:${kc}">${esc(T.kinds[it.kind])}${it.meal ? `<small>${esc(T.meals[it.meal])}</small>` : ''}</span>`;
            if (it.link) {
              // 링크 모드: 명소 근처 맛집·카페를 지도 앱에서 찾아보기
              const ko = SPOT_NAMES[it.near][0], en = SPOT_NAMES[it.near][1];
              const cafe = it.kind === 'cafe';
              return `<li><div class="stop-btn" style="cursor:default">
                <div class="thumb-col"><div class="thumb cat-thumb" style="--c:${kc}">${svg(ICON[KIND_ICON[it.kind]], 34)}</div></div>
                <div>${kindTag}
                  <div class="stop-name">${esc((cafe ? T.cafeLink : T.foodLink)(spotName(it.near)))}</div>
                  ${searchLinksHtml(ko + (cafe ? ' 카페' : ' 맛집'), en + (cafe ? ' cafe' : ' restaurant'))}
                </div></div></li>`;
            }
            if (!it.rec) {
              return `<li><div class="stop-btn" style="cursor:default"><div class="thumb-col">${thumbHtml({ photo: it.key }, '·', kc, KIND_ICON[it.kind])}</div><div>${kindTag}<p class="error">${T.placeError}</p></div></div></li>`;
            }
            const num = ++n;
            const spot = it.kind === 'sight' ? spotInfo(it.key) : null;
            const next = day.slice(idx + 1).find(x => x.rec);
            return `
              <li>
                <button type="button" class="stop-btn" data-rid="${esc(it.rec.id)}" data-i="${num - 1}">
                  <div class="thumb-col">${thumbHtml(it.rec, num, kc, KIND_ICON[it.kind])}</div>
                  <div>
                    ${kindTag}
                    <div class="name-row"><div class="stop-name">${esc(it.rec.name)}</div>${saveBtnHtml(it.rec)}</div>
                    ${it.place ? placeMetaHtml(it.place, openState(it.place)) : ''}
                    ${distHtml(it.rec)}
                    ${spot ? `<p class="tip"><b>${T.tip}</b>${esc(spot.tip[LANG])}</p>` : ''}
                    <div class="actions">${spot ? `<span>⏱ ${T.stay(spot.stay)}</span>` : ''}
                      ${it.place ? `<a class="gmap-link" href="${esc(it.rec.url)}" target="_blank" rel="noopener">${T.openGoogle} ↗</a>` : ''}
                      ${!spot && !it.rec.gphoto ? `<a class="gmap-link" href="${esc(naverSearchUrl(it.rec.name))}" target="_blank" rel="noopener">${T.photosOnNaver}</a>` : ''}</div>
                    ${appButtonsHtml(it.rec, !it.place)}
                  </div>
                </button>
              </li>
              ${next ? `<li class="seg-mini" data-from="${esc(it.rec.id)}" data-to="${esc(next.rec.id)}"><span class="loading">${T.routeLoading}</span></li>` : ''}`;
          }).join('')}
        </ol>`;
      $('planDayList').querySelectorAll('.stop-btn[data-rid]').forEach(b => {
        const i = Number(b.dataset.i);
        const it = day.filter(x => x.rec)[i];
        b.addEventListener('click', () => { if (mapsReady) focusOn(it.rec, () => openPlanItem(d, i)); });
      });

      // 지도: 고른 날은 진하게, 다른 날은 흐리게
      if (mapsReady) {
        planLayer.markers.forEach((ms, j) => ms.forEach(m => { m.content.style.opacity = j === d ? 1 : 0.4; m.zIndex = j === d ? 10 : 1; }));
        planLayer.lines.forEach((l, j) => l.setOptions({ ...lineOptions(j, j === d), zIndex: j === d ? 5 : 1 }));
        if (fit) {
          infoWindow.close();
          const b = new google.maps.LatLngBounds();
          day.filter(it => it.rec).forEach(it => b.extend({ lat: it.rec.lat, lng: it.rec.lng }));
          if (!b.isEmpty()) map.fitBounds(b, 70);
        }
      }

      // 고른 날의 장소 사이 대중교통 시간 (Google Compute Routes)
      const byId = id => day.find(x => x.rec && x.rec.id === id);
      $('planDayList').querySelectorAll('.seg-mini').forEach(async el => {
        const a = byId(el.dataset.from), b = byId(el.dataset.to);
        if (!a.place || !b.place) {
          // 링크 모드: Google 지도 대중교통 길찾기 링크만
          el.innerHTML = `<a href="${esc(googleDirUrl(spotInfo(a.key).query, spotInfo(b.key).query))}" target="_blank" rel="noopener">🚇 ${T.directions} (Google) ↗</a>`;
          return;
        }
        const key = el.dataset.from + '>' + el.dataset.to;
        if (!routeCache.has(key)) routeCache.set(key, transitRoute(a.place, b.place).catch(() => 'error'));
        const route = await routeCache.get(key);
        const link = `<a href="${esc(directionsUrl(a.place, b.place))}" target="_blank" rel="noopener">${T.directions} ↗</a>`;
        el.innerHTML = route && route !== 'error'
          ? `🚇 ${fmtDur(parseInt(route.duration, 10))} · ${fmtKm(route.distanceMeters || 0)} · ${link}`
          : `${route === 'error' ? T.routeError : T.routeNone} · ${link}`;
      });
    }

    // ---------- 내 위치 ----------
    $('locateBtn').addEventListener('click', () => {
      if (!navigator.geolocation) { toast(T.locError); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        updateDistances();
        if (!mapsReady) return;
        if (myMarker) myMarker.map = null;
        const dot = document.createElement('div');
        dot.className = 'me-dot';
        myMarker = new AdvancedMarkerElement({ map, position: myPos, content: dot, title: T.myLocation, zIndex: 20 });
        map.panTo(myPos);
        if (map.getZoom() < 13) map.setZoom(14);
      }, () => toast(T.locError), { enableHighAccuracy: true, timeout: 10000 });
    });

    // ---------- Google 지도 시작 ----------
    async function initMap() {
      const { Map, InfoWindow } = await google.maps.importLibrary('maps');
      ({ AdvancedMarkerElement } = await google.maps.importLibrary('marker'));
      ({ Place } = await google.maps.importLibrary('places'));

      map = new Map($('map'), {
        center: REGIONS.all.center,
        zoom: REGIONS.all.zoom,
        mapId: 'DEMO_MAP_ID', // 고급 마커를 쓰려면 꼭 필요한 값
        renderingType: google.maps.RenderingType.VECTOR,
        isFractionalZoomEnabled: true, // 6.5단계처럼 중간 크기로도 확대 → 한국이 지도 칸에 꽉 차게
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true
      });
      infoWindow = new InfoWindow({ maxWidth: 320 });
      mapsReady = true;
      showRegionOnMap();

      // 주변 찾기 화면에서 지도를 옮기면 "이 지역에서 다시 찾기" 버튼 보이기
      map.addListener('dragend', () => {
        if (nearbyCat && mode === nearbyCat) $('researchBtn').hidden = false;
      });
    }

    // API 키가 틀렸거나 사용할 수 없을 때 Google이 부르는 함수
    //  → 지도 대신 "링크 모드" 안내를 보여 주고, 코스·일정은 지도 앱 버튼으로 계속 쓸 수 있게
    window.gm_authFailure = () => {
      showMapRest();
      // 이미 열어 둔 코스가 있으면 링크 모드로 다시 그리기
      if (mode === 'courses' && !$('courseDetail').hidden && lastCourse !== null) openCourse(lastCourse);
    };

    if (GOOGLE_MAPS_API_KEY.includes('YOUR_')) {
      showMapMsg(T.keyTitle, T.keyText);
    } else {
      // Google 공식 로딩 방식 (Dynamic Library Import)
      (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
        key: GOOGLE_MAPS_API_KEY,
        v: 'weekly',
        language: LANG_CODE,
        region: 'KR'
      });

      initMap().catch(showMapRest);
    }
  </script>
</body>
