<head>

  <!-- 카카오톡·문자 링크 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="GENIE MAP 지니맵 · Korea Travel Courses">
  <meta property="og:description" content="외국인 여행자를 위한 한국 여행 코스 지도 · Seoul, Busan, Gyeongju, Jeju">

  <!-- 브라우저 탭 아이콘 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237a5af8'/%3E%3Cstop offset='1' stop-color='%233d6af2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 11c-8.3 0-15 6.5-15 14.6C17 36.5 32 52 32 52s15-15.5 15-26.4C47 17.5 40.3 11 32 11z' fill='%23fff'/%3E%3Ccircle cx='32' cy='26' r='6' fill='%23ffb020'/%3E%3C/svg%3E">

  <!-- 글꼴 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #3d6af2;
      --blue-deep: #2346c4;
      --violet: #7a5af8;
      --grad: linear-gradient(90deg, #7a5af8 0%, #3d6af2 100%);
      --sun: #ffb020;
      --coral: #ff6b6b;
      --mint: #12b5a0;
      --bg: #f4f7ff;
      --soft: #eef3ff;
      --card: #ffffff;
      --line: #e6eaf3;
      --ink: #1d2433;
      --muted: #6b7280;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(37, 64, 160, 0.08);
      --header-h: 68px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    h1, h2, h3, h4 { font-family: 'Noto Serif KR', serif; font-weight: 700; }
    .en { font-family: 'Cormorant Garamond', serif; font-style: italic; }
    a { color: var(--blue); }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

    /* ---------- 머리글 (흰색) ---------- */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #fff;
      box-shadow: 0 2px 12px rgba(37, 64, 160, 0.06);
    }
    .header-inner {
      height: var(--header-h);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex-shrink: 0; }
    .logo {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: var(--grad);
      display: grid; place-items: center;
      box-shadow: 0 4px 12px rgba(61, 106, 242, 0.3);
    }
    .brand-en { font-size: 1.5rem; font-weight: 600; line-height: 1; color: var(--ink); }
    .brand-ko { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 0.95rem; color: var(--blue); margin-left: 6px; }

    .top-search {
      flex: 1;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      background: var(--soft);
      border: 1.5px solid transparent;
      border-radius: 999px;
      padding: 4px 4px 4px 18px;
      transition: border-color .2s, background .2s;
    }
    .top-search:focus-within { border-color: var(--blue); background: #fff; }
    .top-search input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.95rem;
      padding: 6px 0;
    }
    .top-search input:focus { outline: none; }
    .top-search button {
      width: 40px; height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      display: grid; place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .top-search button:hover { background: var(--blue-deep); }

    .lang {
      display: flex; align-items: center; gap: 4px;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      padding: 2px 6px 2px 12px;
      flex-shrink: 0;
    }
    .lang select {
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.9rem;
      padding: 6px 2px;
      cursor: pointer;
    }

    /* ---------- 앱 화면: 왼쪽 패널 + 오른쪽 지도 ---------- */
    .app {
      display: grid;
      grid-template-columns: 440px 1fr;
      height: calc(100vh - var(--header-h));
      min-height: 520px;
    }
    .side {
      background: #fff;
      border-right: 1px solid var(--line);
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* 날씨 카드 */
    .weather-card {
      margin: 16px 16px 0;
      border-radius: var(--radius);
      padding: 18px 20px;
      background:
        radial-gradient(circle at 92% 12%, rgba(255, 176, 32, 0.35), rgba(255, 176, 32, 0) 38%),
        linear-gradient(135deg, #e7efff 0%, #f1eaff 55%, #fff6e6 100%);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .wc-tag { font-size: 0.95rem; color: var(--violet); }
    .weather-card h2 { font-size: 1.35rem; line-height: 1.3; margin: 2px 0 4px; word-break: keep-all; }
    .weather-card p { font-size: 0.85rem; color: #4b5563; word-break: keep-all; }
    .wc-right { text-align: right; flex-shrink: 0; }
    .wc-now { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 0.82rem; color: #4b5563; }
    .wc-now img { width: 34px; height: 34px; }
    .wc-temp { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 1.7rem; line-height: 1; color: var(--ink); }
    .wc-desc { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

    /* 카테고리 아이콘 */
    .cats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px 2px;
      padding: 16px 12px 12px;
      border-bottom: 8px solid var(--bg);
    }
    .cat {
      border: 0;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 6px 2px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.8rem;
      color: #4b5563;
      line-height: 1.3;
      text-align: center;
      word-break: keep-all;
    }
    .cat-ico {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      background: #fff;
      display: grid; place-items: center;
      color: var(--ico, var(--blue));
      transition: transform .2s, background .2s, box-shadow .2s;
    }
    .cat:hover .cat-ico { transform: translateY(-2px); box-shadow: var(--shadow); }
    .cat[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
    .cat[aria-pressed="true"] .cat-ico { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 6px 16px rgba(61, 106, 242, 0.3); }

    .side-body { padding: 16px 18px 24px; }
    .section-title { font-size: 1.15rem; margin-bottom: 10px; }

    /* 지역 고르기 */
    .region-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .region-filter button {
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }
    .region-filter button.viewing { border-color: var(--blue); color: var(--blue); }
    .region-filter button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }

    /* 지역별 묶음 */
    .region-list { list-style: none; }
    .region-sec + .region-sec { margin-top: 26px; }
    .region-head {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(6px);
      margin: 0 -18px 12px;
      padding: 10px 18px 8px;
      border-bottom: 1px solid var(--line);
    }
    .region-head h3 { display: flex; align-items: baseline; gap: 8px; font-size: 1.15rem; }
    .region-head h3 .en { font-size: 1rem; font-weight: 500; color: var(--violet); }
    .region-head h3 small { margin-left: auto; font-family: 'Noto Sans KR', sans-serif; font-size: 0.78rem; font-weight: 500; color: var(--muted); }
    .region-head p { font-size: 0.85rem; color: #4b5563; margin-top: 2px; word-break: keep-all; }

    /* 사진 코스 카드 */
    .course-list { list-style: none; display: grid; gap: 14px; }
    .course-card {
      width: 100%;
      text-align: left;
      border: 0;
      background: #fff;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .course-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(37, 64, 160, 0.14); }
    .cover {
      position: relative;
      height: 158px;
      background: var(--soft) center / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 14px 16px;
      color: #fff;
    }
    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 30%, rgba(10, 16, 40, 0.72) 100%);
    }
    .cover > * { position: relative; }
    .cover-num {
      align-self: flex-start;
      font-size: 0.95rem;
      font-weight: 600;
      background: var(--c, var(--blue));
      border-radius: 999px;
      padding: 0 10px;
      margin-bottom: 6px;
    }
    .cover h3 { font-size: 1.15rem; line-height: 1.35; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); word-break: keep-all; }
    .credit {
      position: absolute !important;
      top: 10px; right: 10px;
      max-width: 60%;
      font-size: 0.68rem;
      color: #fff;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.38);
      border-radius: 999px;
      padding: 1px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .credit:hover { background: rgba(0, 0, 0, 0.6); }
    .card-body { padding: 12px 16px 14px; }
    .card-body p { font-size: 0.88rem; color: #4b5563; word-break: keep-all; }
    .course-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .chip {
      font-size: 0.75rem;
      border-radius: 999px;
      padding: 1px 10px;
      background: var(--soft);
      color: var(--blue-deep);
    }

    /* 코스 상세 */
    .back {
      border: 0; background: none;
      color: var(--blue);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 2px 0;
      margin-bottom: 10px;
    }
    .detail-cover { border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow); }
    .detail-cover .cover { height: 180px; }
    .detail-cover .card-body { background: #fff; }
    .total {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--blue-deep);
      background: var(--soft);
      border-radius: 10px;
      padding: 6px 10px;
    }

    .timeline { list-style: none; }
    .stop-btn, .result-btn {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 12px;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
    }
    .stop-btn:hover, .result-btn:hover { border-color: #c9d4f2; }
    .stop-btn.active, .result-btn.active { border-color: var(--course, var(--blue)); box-shadow: var(--shadow); }
    .thumb-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .thumb {
      position: relative;
      width: 92px; height: 92px;
      border-radius: 14px;
      background: var(--soft) center / cover no-repeat;
    }
    .thumb .num {
      position: absolute;
      left: 6px; top: 6px;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--course, var(--blue));
      border: 2px solid #fff;
      color: #fff;
      display: grid; place-items: center;
      font-weight: 700;
      font-size: 0.8rem;
    }
    .thumb.cat-thumb { display: grid; place-items: center; color: #fff; background: var(--c, var(--blue)); }
    .thumb-credit {
      font-size: 0.62rem;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .name-row { display: flex; align-items: flex-start; gap: 8px; }
    .stop-name { flex: 1; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 1rem; line-height: 1.4; }
    .save-btn {
      flex-shrink: 0;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      display: grid; place-items: center;
      font-size: 0.95rem;
      color: var(--muted);
      background: #fff;
      cursor: pointer;
      line-height: 1;
    }
    .save-btn:hover { border-color: var(--coral); color: var(--coral); }
    .save-btn.on { border-color: var(--coral); background: #fff0f0; color: var(--coral); }
    .addr { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 5px; font-size: 0.78rem; color: #4b5563; }
    .badge { font-size: 0.7rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
    .badge.open { background: #dcf7ee; color: #0f7a5c; }
    .badge.closed { background: #ffe8e8; color: #c42b2b; }
    .dist { font-size: 0.78rem; color: var(--violet); font-weight: 500; margin-top: 3px; }
    .dist:empty { display: none; }
    .tip {
      margin-top: 8px;
      font-size: 0.84rem;
      background: #fff8e8;
      border-radius: 10px;
      padding: 7px 10px;
      word-break: keep-all;
    }
    .tip b { color: #d97706; margin-right: 4px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
    .actions a { font-weight: 700; text-decoration: none; }
    .loading { font-size: 0.85rem; color: var(--muted); }
    .error { font-size: 0.85rem; color: #c42b2b; }

    /* 네이버 지도·티맵 길찾기 버튼 */
    .app-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .app-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 11px 3px 4px;
      cursor: pointer;
    }
    .app-btn:hover { border-color: #c9d4f2; background: var(--soft); }
    .app-btn i {
      width: 20px; height: 20px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-style: normal;
      font-size: 0.68rem;
      color: #fff;
    }
    .app-btn.naver i { background: #03c75a; }
    .app-btn.tmap i { background: #ef3e5c; }
    .app-btn.google i { background: #4285f4; }

    /* 장소 사이 대중교통 구간 */
    .seg {
      margin: 0 0 0 44px;
      border-left: 2px dashed #c9d4f2;
      padding: 10px 0 10px 18px;
      font-size: 0.82rem;
    }
    .seg-main { font-weight: 700; color: var(--blue-deep); }
    .lines { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .line { font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 7px; color: #fff; background: #555; }
    .seg a { font-weight: 700; text-decoration: none; }
    .note {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--soft);
      border-radius: 10px;
      padding: 10px 12px;
      word-break: keep-all;
    }

    /* 목록 화면 (주변 찾기 · 검색 · 내 여행) */
    .list-head { margin-bottom: 12px; }
    .list-head h2 { font-size: 1.15rem; line-height: 1.4; word-break: keep-all; }
    .list-head p { font-size: 0.82rem; color: var(--muted); margin-top: 2px; word-break: keep-all; }
    .result-list { list-style: none; display: grid; gap: 10px; }

    /* 사진 출처 */
    .credits { margin-top: 24px; font-size: 0.75rem; color: var(--muted); }
    .credits summary { cursor: pointer; font-weight: 700; }
    .credits ul { list-style: none; margin: 8px 0; display: grid; gap: 2px; }
    .credits a { color: var(--muted); }
    .credits p { margin-top: 8px; word-break: keep-all; }

    /* 카테고리 그림 (실제 사진이 없을 때) */
    .thumb.cat-thumb {
      background: radial-gradient(circle at 75% 20%, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 45%),
        linear-gradient(135deg, var(--c, var(--blue)) 0%, color-mix(in srgb, var(--c, var(--blue)) 55%, #fff) 100%);
    }
    .thumb.cat-thumb svg { filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18)); }

    /* 카테고리 분위기 사진 띠 (예시 사진) */
    .cat-banner {
      position: relative;
      height: 150px;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
      background: var(--soft) center / cover no-repeat;
      display: flex;
      align-items: flex-end;
      padding: 14px 16px;
      color: #fff;
    }
    .cat-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 35%, rgba(10, 16, 40, 0.7) 100%);
    }
    .cat-banner > * { position: relative; }
    .cat-banner h2 { font-size: 1.3rem; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); display: flex; align-items: center; gap: 8px; }
    .example-tag {
      position: absolute !important;
      left: 12px; top: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      border-radius: 999px;
      padding: 2px 10px;
    }

    /* 자동 추천 일정 */
    .plan-cta {
      width: 100%;
      border: 0;
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      background: var(--grad);
      color: #fff;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(61, 106, 242, 0.25);
    }
    .plan-cta b { display: block; font-size: 1rem; }
    .plan-cta small { font-size: 0.8rem; opacity: 0.9; }
    .plan-cta .arrow { margin-left: auto; font-size: 1.3rem; }
    .form-label { font-size: 0.92rem; margin: 14px 0 8px; }
    .primary-btn {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      padding: 13px;
      background: var(--grad);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(61, 106, 242, 0.25);
    }
    .primary-btn:disabled { opacity: 0.6; cursor: wait; }
    .plan-summary {
      border-radius: var(--radius);
      padding: 18px;
      color: #fff;
      background: var(--grad);
      margin-bottom: 14px;
    }
    .plan-summary h3 { font-size: 1.15rem; line-height: 1.4; word-break: keep-all; }
    .plan-summary .stats { display: flex; align-items: center; gap: 14px; margin-top: 12px; background: #fff; color: var(--ink); border-radius: 14px; padding: 12px 14px; }
    .plan-badge {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--grad);
      color: #fff;
      display: grid; place-items: center;
      text-align: center;
      font-weight: 700;
      font-size: 0.82rem;
      line-height: 1.2;
      flex-shrink: 0;
      word-break: keep-all;
    }

    .stats li::before { content: "· "; color: var(--blue); font-weight: 700; }
    .plan-summary .link-btn { margin-top: 10px; border: 0; background: none; color: #fff; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
    .day-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 12px; }
    .day-tab {
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 5px 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .day-tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .parking-btn {
      margin-left: auto;
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 4px 12px 4px 6px;
      font-size: 0.82rem;
      display: inline-flex; align-items: center; gap: 4px;
      cursor: pointer;
    }
    .day-head { font-size: 1.2rem; margin: 4px 0 10px; }
    .kind {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      background: var(--k, var(--blue));
      border-radius: 4px;
      padding: 0 7px;
      margin-bottom: 2px;
    }

    .seg-mini a { font-weight: 700; text-decoration: none; }
    .plan-legend {
      position: absolute;
      right: 60px; top: 10px;
      z-index: 4;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      padding: 8px 14px;
      display: flex;
      gap: 14px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .plan-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .plan-legend i { width: 26px; border-top: 3px solid var(--d); }

    /* 지도 */
    .map-wrap { position: relative; }
    #map { position: absolute; inset: 0; background: #e8eefb; }
    .map-btn {
      position: absolute;
      z-index: 4;
      border: 0;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .locate-btn { right: 10px; top: 62px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--blue); }
    .research-btn {
      left: 50%; top: 14px;
      transform: translateX(-50%);
      border-radius: 999px;
      padding: 9px 18px;
      color: var(--blue);
      display: flex; align-items: center; gap: 6px;
    }
    .map-msg {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e7efff 0%, #f1eaff 100%);
      padding: 16px;
    }
    .map-msg-card { max-width: 380px; background: #fff; border-radius: 16px; box-shadow: var(--shadow); padding: 24px; text-align: center; }
    .map-msg-card h3 { font-size: 1.15rem; margin: 6px 0; }
    .map-msg-card p { color: var(--muted); font-size: 0.9rem; word-break: keep-all; }

    /* 지도 위 마커 */
    .mk {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 3px solid #fff;
      color: #fff;
      display: grid; place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.28);
      transition: transform .2s;
    }
    .mk.active { transform: scale(1.25); }
    .me-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--blue);
      border: 3px solid #fff;
      box-shadow: 0 0 0 8px rgba(61, 106, 242, 0.22);
    }

    /* 정보 창 */
    .iw-title { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 1rem; }
    .iw { max-width: 280px; font-family: 'Noto Sans KR', sans-serif; }
    .iw-photo { width: 100%; height: 120px; border-radius: 10px; background: var(--soft) center / cover no-repeat; margin-bottom: 6px; }

    .toast {
      position: fixed;
      left: 50%; bottom: 24px;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      background: var(--ink);
      color: #fff;
      font-size: 0.88rem;
      border-radius: 12px;
      padding: 10px 16px;
      box-shadow: var(--shadow);
      z-index: 50;
      word-break: keep-all;
    }

    /* ---------- 휴대폰·태블릿 ---------- */
    @media (max-width: 900px) {
      .site-header { position: static; }
      .header-inner { height: auto; flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
      .brand { margin-right: auto; }
      .top-search { order: 3; flex-basis: 100%; max-width: none; }
      .app { display: flex; flex-direction: column; height: auto; }
      /* 지도를 화면 위에 붙여 두고, 아래 목록을 스크롤하면 지도가 따라 움직임 */
      .map-wrap { order: -1; position: sticky; top: 0; z-index: 6; height: 42vh; min-height: 280px; }
      .side { overflow: visible; border-right: 0; }
      .region-head { position: static; }
    }
    @media (max-width: 480px) {
      .brand-ko { display: none; }
      .weather-card { margin: 12px 12px 0; padding: 16px; }
      .cats { padding: 14px 8px 10px; }
      .cat-ico { width: 46px; height: 46px; }
      .side-body { padding: 14px 14px 24px; }
      .region-head { margin: 0 -14px 12px; padding: 10px 14px 8px; }
      .stop-btn, .result-btn { grid-template-columns: 76px 1fr; }
      .thumb { width: 76px; height: 76px; }
    }

</head>
